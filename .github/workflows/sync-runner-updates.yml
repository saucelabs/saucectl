name: sync-framework-versions-for-runner-updates

# Reads the framework version each public runner currently ships (from its
# package.json on `main`) and, if saucectl's schema enums are behind, opens a
# "chore: add latest versions" PR. If everything is already in sync, it does
# nothing.

on:
  workflow_dispatch: {}        # manual "Run workflow" button only

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout saucectl
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync schema version enums from runners
        id: sync
        run: python3 scripts/sync_framework_versions.py

      - name: Report (no changes)
        if: steps.sync.outputs.changed != 'true'
        run: echo "All frameworks already in sync — no PR needed."

      - name: Create / update pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-framework-versions
          delete-branch: true
          base: main
          add-paths: |
            api/**/*.schema.json
          commit-message: "chore: add latest versions"
          title: "chore: add latest versions"
          body: ${{ steps.sync.outputs.pr_body }}
          labels: |
            chore
            automated
